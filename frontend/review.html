<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Statement Review</title>
<style>
  :root { --bg:#f6f6f4; --fg:#1d1d1b; --muted:#6b6b66; --line:#dcdcd6; --card:#fff; --sel:#e8eefc;
          --ok:#1f7a3a; --warn:#9a6700; --bad:#b42318; --badbg:#fdecea; --accent:#2f5bd3; --issue:#fff6db; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#151514; --fg:#ececea; --muted:#9d9d97; --line:#33332f; --card:#1e1e1c; --sel:#22304f;
            --ok:#4cc172; --warn:#e0a92e; --bad:#f2725f; --badbg:#3a1d1a; --accent:#7f9cf5; --issue:#3a3218; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin:0; background:var(--bg); color:var(--fg); font:13px/1.45 system-ui, sans-serif; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:16px; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--card); }
  header h1 { font-size:16px; margin:0; } header a { color:var(--accent); }
  .muted { color:var(--muted); }
  main { flex:1; display:grid; grid-template-columns: 230px minmax(0,1fr) minmax(480px, 47%); min-height:0; }
  aside, #viewer, #output { overflow:auto; min-height:0; }
  aside { border-right:1px solid var(--line); background:var(--card); padding:8px 0; }
  aside h2 { font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:12px 12px 4px; }
  .src { display:block; width:100%; text-align:left; border:0; background:none; color:inherit; padding:6px 12px; cursor:pointer; font:inherit; }
  .src:hover { background:var(--bg); } .src.active { background:var(--sel); }
  .src .name { display:block; overflow-wrap:anywhere; }
  #viewer { background:#8a8a85; padding:12px; }
  @media (prefers-color-scheme: dark) { #viewer { background:#0d0d0c; } }
  .page { margin:0 auto 12px; max-width:900px; background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.3); }
  .page img { display:block; width:100%; height:auto; }
  .page .pno { font-size:11px; color:#555; padding:2px 6px; background:#eee; }
  #viewer .empty, #output .empty { color:#eee; padding:40px; text-align:center; }
  #output .empty { color:var(--muted); }
  #output { border-left:1px solid var(--line); background:var(--card); padding:12px 14px 0; }
  #output h2 { font-size:13px; margin:18px 0 6px; }
  table { width:100%; border-collapse:collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align:left; padding:4px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:11px; color:var(--muted); font-weight:600; position:sticky; top:0; background:var(--card); }
  td.num { text-align:right; white-space:nowrap; } td.cb { width:24px; } td.nowrap { white-space:nowrap; }
  .tablewrap { overflow-x:auto; } .txns td, .txns th { font-size:12px; padding:3px 5px; } .txns td.desc { min-width:180px; }
  tr.flagged td { background:var(--badbg); }
  tr.missing td { background:var(--issue); }
  select.state { font:inherit; font-size:12px; padding:1px 2px; border:1px solid var(--line); border-radius:4px; background:var(--card); color:inherit; }
  .notice { margin:10px 0; padding:8px 10px; border:1px solid var(--line); border-left:3px solid var(--warn); border-radius:6px; }
  .notice button { margin-left:8px; }
  .golden { margin:10px 0; padding:8px 10px; border:1px solid var(--line); border-left:3px solid var(--ok); border-radius:6px; }
  .golden.differs { border-left-color:var(--bad); }
  .golden ul { margin:6px 0 0; padding-left:18px; max-height:180px; overflow:auto; font-size:12px; }
  button.secondary { padding:6px 12px; border:1px solid var(--ok); border-radius:6px; background:none; color:var(--ok); cursor:pointer; }
  button.secondary:disabled { opacity:.5; cursor:default; }
  #save-state.ok { color:var(--ok); } #save-state.bad { color:var(--bad); font-weight:600; }
  tr.issue td:not(.cb) { box-shadow: inset 3px 0 0 var(--warn); }
  .selfrev { margin:10px 0; padding:8px 10px; border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:6px; }
  .selfrev h3 { margin:8px 0 4px; font-size:13px; }
  .selfrev ul { margin:2px 0 6px; padding-left:18px; }
  .selfrev li { margin:3px 0; }
  .selfrev .verdict { margin-left:6px; white-space:nowrap; }
  .selfrev .verdict button { padding:1px 7px; margin-left:3px; border:1px solid var(--line); border-radius:5px; background:none; color:inherit; cursor:pointer; font-size:12px; }
  .selfrev .verdict button.on { border-color:var(--accent); color:var(--accent); font-weight:600; }
  .selfrev input.note { width:min(320px, 90%); margin:2px 0 0 0; font-size:12px; }
  .conf { font-size:11px; padding:0 5px; border-radius:8px; border:1px solid currentColor; white-space:nowrap; }
  .conf.high { color:var(--ok); } .conf.medium { color:var(--muted); } .conf.low { color:var(--bad); } .conf.missing { color:var(--warn); }
  tr.txn { cursor:pointer; }
  .pill { display:inline-block; padding:0 7px; border-radius:999px; font-size:11px; border:1px solid currentColor; }
  .PASS, .EXTRACTED { color:var(--ok); } .WARN, .NEEDS_REVIEW, .PROCESSING, .RECEIVED, .NEEDS_PASSWORD { color:var(--warn); }
  .FAIL, .FAILED, .NEEDS_OCR { color:var(--bad); }
  textarea { width:100%; min-height:110px; font:inherit; padding:8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); }
  .bar { position:sticky; bottom:0; z-index:1; border-top:1px solid var(--line); display:flex; gap:10px; align-items:center; padding:10px 0; background:var(--card); }
  button.primary { padding:6px 14px; border:0; border-radius:6px; background:var(--accent); color:#fff; cursor:pointer; }
  form.unlock { display:flex; gap:8px; justify-content:center; padding:30px; }
  form.unlock input { padding:6px 8px; border-radius:6px; border:1px solid var(--line); }
  .legend { font-size:11px; }
  @media (max-width: 1000px) { main { grid-template-columns: 1fr; } aside, #viewer, #output { max-height: none; } #viewer { min-height: 60vh; } }
</style>
</head>
<body>
<header>
  <h1>Statement review</h1>
  <span class="muted">Mark each output that is wrong, or missing (printed on the statement but not extracted), add remarks, and save. Clicking a transaction scrolls the PDF to its page.</span>
  <span style="flex:1"></span>
  <a href="/">Upload page</a> <a href="/autonomy">Agent autonomy</a>
</header>
<main>
  <aside id="sources"></aside>
  <section id="viewer"><div class="empty">Select a PDF on the left.</div></section>
  <section id="output"><div class="empty">The extracted output appears here.</div></section>
</main>
<script>
// Statement data is untrusted text: it is inserted with textContent only, never innerHTML.
const $ = s => document.querySelector(s);
function el(tag, text, cls) { const e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; }
function pill(v) { return el("span", v || "—", "pill " + (v || "")); }
// Display money as Indian-grouped text ("120749.89" -> "1,20,749.89") by string manipulation only,
// so the shown digits are exactly the stored Decimal string (no float conversion).
function inr(v) {
  if (v == null || v === "") return "";
  const m = /^(-?)(\d+)(\.\d+)?$/.exec(String(v)); if (!m) return String(v);
  let [, sign, int, frac] = m; frac = frac || "";
  if (int.length > 3) { const last = int.slice(-3); let rest = int.slice(0, -3); const parts = [];
    while (rest.length > 2) { parts.unshift(rest.slice(-2)); rest = rest.slice(0, -2); }
    if (rest) parts.unshift(rest); int = parts.join(",") + "," + last; }
  return sign + int + frac;
}

// Server times are UTC (ISO 8601); show them in India Standard Time, e.g. "14 Oct 2026, 14:41 IST".
function ist(iso) {
  const d = new Date(iso); if (isNaN(d)) return iso;
  return d.toLocaleString("en-IN", { timeZone: "Asia/Kolkata", day: "2-digit", month: "short", year: "numeric",
                                     hour: "2-digit", minute: "2-digit", hour12: false }) + " IST";
}

const HEADER_FIELDS = [
  ["bank_name", "Bank"], ["bank_address", "Bank address"], ["account_holder_name", "Account holder"],
  ["account_holder_address", "Holder address"], ["account_number", "Account number"], ["ifsc", "IFSC"],
  ["branch", "Branch"], ["currency", "Currency"], ["period_start", "Statement start"], ["period_end", "Statement end"],
  ["opening_balance", "Opening balance"], ["closing_balance", "Closing balance"]];
const SUMMARY_FIELDS = [["total_debits", "Total debits"], ["total_credits", "Total credits"],
  ["debit_count", "Debit count"], ["credit_count", "Credit count"]];

let current = null;          // { docId, extractionId, flags:Set (wrong), missing:Set (printed, not extracted), remarks }
let pollTimer = null, saveTimer = null;
let showToken = 0;           // only the latest selection may update the screen

async function loadSources(activeDocId) {
  const list = await (await fetch("/api/review/sources")).json();
  const box = $("#sources"); box.replaceChildren();
  let group = null;
  for (const s of list) {
    if (s.group !== group) { group = s.group; box.append(el("h2", group)); }
    const b = el("button", null, "src" + (s.document_id === activeDocId ? " active" : ""));
    b.append(el("span", s.name, "name"));
    const meta = el("span", null, "muted");
    meta.append(s.imported ? pill(s.status) : el("span", "not imported"));
    if (s.page_count) meta.append(el("span", ` · ${s.page_count} p`));
    if (s.flagged != null) meta.append(el("span", ` · ${s.flagged} flagged`));
    if (s.golden_version != null) meta.append(el("span", ` · golden v${s.golden_version}`, "PASS"));
    b.append(meta);
    b.onclick = () => select(s);
    box.append(b);
  }
}

async function select(s) {
  clearTimeout(pollTimer);
  await flushSave();                                   // never lose edits when switching documents
  const token = ++showToken;
  let docId = s.document_id;
  if (!s.imported) {
    $("#viewer").replaceChildren(el("div", "Importing and processing…", "empty"));
    const r = await fetch(`/api/review/sources/${encodeURIComponent(s.source_id)}/import`, { method: "POST" });
    if (!r.ok) { $("#viewer").replaceChildren(el("div", "Import failed.", "empty")); return; }
    docId = (await r.json()).document_id;
    if (token !== showToken) return;
  }
  await show(docId, token);
}

async function show(docId, token = ++showToken) {
  const r = await fetch("/api/documents/" + docId);
  if (!r.ok || token !== showToken) return;           // a newer selection replaced this one
  const { document: doc, extraction: ex } = await r.json();
  loadSources(docId);
  if (["RECEIVED", "PROCESSING", "LEARNING"].includes(doc.status) || (!ex && doc.status !== "NEEDS_PASSWORD" && doc.status !== "FAILED" && doc.status !== "NEEDS_OCR" && doc.status !== "NEEDS_REVIEW")) {
    $("#output").replaceChildren(el("div", doc.status === "LEARNING"
      ? "Learning this layout… the checked result will appear here (this can take a minute)." : "Processing…", "empty"));
    clearTimeout(pollTimer);
    pollTimer = setTimeout(() => { if (token === showToken) show(docId, token); }, 1200);
  }
  await renderViewer(doc, token);
  if (token !== showToken) return;
  if (ex) await renderOutput(doc, ex, token);
  else if (!["RECEIVED", "PROCESSING"].includes(doc.status)) $("#output").replaceChildren(el("div", doc.error || doc.status, "empty"));
}

async function renderViewer(doc, token) {
  const v = $("#viewer");
  if (v.dataset.doc === doc.id && v.dataset.pages === String(doc.page_count)) return;   // already showing
  v.replaceChildren(); v.dataset.doc = ""; v.scrollTop = 0;
  if (!doc.page_count) { v.append(el("div", "Pages appear once the PDF has been opened.", "empty")); return; }
  const probe = await fetch(`/api/documents/${doc.id}/pages/1.png?scale=0.5`);
  if (token !== showToken) return;
  if (probe.status === 423) { v.append(unlockForm(doc)); return; }
  v.dataset.doc = doc.id; v.dataset.pages = String(doc.page_count);
  for (let n = 1; n <= doc.page_count; n++) {
    const wrap = el("div", null, "page"); wrap.id = "page-" + n;
    const img = el("img"); img.loading = "lazy"; img.alt = "Page " + n;
    const src = `/api/documents/${doc.id}/pages/${n}.png`;
    img.src = src;
    img.onerror = () => {                      // retry once, then offer a manual retry
      if (!img.dataset.retried) { img.dataset.retried = "1"; setTimeout(() => { img.src = src + "?retry=" + Date.now(); }, 600); return; }
      const msg = el("div", `Page ${n} could not be shown — click to retry.`, "pno"); msg.style.cursor = "pointer";
      msg.onclick = () => { msg.remove(); delete img.dataset.retried; img.src = src + "?retry=" + Date.now(); };
      wrap.insertBefore(msg, img);
    };
    wrap.append(img, el("div", "Page " + n, "pno"));
    v.append(wrap);
  }
}

function unlockForm(doc) {
  const f = el("form", null, "unlock");
  const i = el("input"); i.type = "password"; i.name = "password"; i.placeholder = "PDF password"; i.autocomplete = "off";
  const b = el("button", "Show pages", "primary");
  const msg = el("span", "", "muted");
  f.append(i, b, msg);
  f.onsubmit = async e => {
    e.preventDefault();
    const r = await fetch(`/api/documents/${doc.id}/unlock`, { method: "POST", body: new FormData(f) });
    if (r.ok) { $("#viewer").dataset.doc = ""; renderViewer(doc, showToken); }
    else msg.textContent = r.status === 403 ? "Wrong password." : "Could not unlock.";
  };
  return f;
}

async function renderOutput(doc, ex, token) {
  const st = ex.statement || {}; const h = st.header || {}; const sm = st.summary || {};
  const saved = (await (await fetch(`/api/documents/${doc.id}/review`)).json());
  const gold = await (await fetch(`/api/documents/${doc.id}/golden`)).json();
  if (token !== showToken) return;
  if (current && current.docId !== doc.id) await flushSave();
  const review = saved.extraction_id === ex.id ? saved.review : null;
  const txnCount = ((ex.statement || {}).transactions || []).length;
  current = { docId: doc.id, extractionId: ex.id, txnCount, flags: new Set(review ? review.flags : []),
              missing: new Set(review ? review.missing || [] : []), remarks: review ? review.remarks : "",
              feedback: Object.assign({}, review ? review.agent_feedback || {} : {}),
              sr: saved.extraction_id === ex.id ? saved.self_review : null,
              routing: saved.extraction_id === ex.id ? saved.routing : null };
  dirty = false;

  const issueRows = new Set();
  for (const c of (ex.report && ex.report.checks) || []) for (const i of c.issues) if (i.row_index != null) issueRows.add(i.row_index);

  const out = $("#output"); out.replaceChildren();
  const top = el("div");
  top.append(el("strong", doc.original_name || doc.id.slice(0, 12)), el("span", "  "), pill(doc.status),
             el("span", "  validation "), pill(ex.report && ex.report.status));
  out.append(top);
  const meta = el("div", `${ex.workflow} · ${ex.strategy}${ex.template_id ? " · " + ex.template_id : ""} · extraction #${ex.id} · `, "muted");
  const again = el("a", "Re-extract with current code"); again.href = "#"; again.title = "Runs extraction again; saved reviews stay with the extraction they were made on.";
  again.onclick = async e => { e.preventDefault(); again.textContent = "Re-extracting…"; await reextract(doc.id, ex.id, token); };
  meta.append(again);
  out.append(meta);

  const prev = saved.extraction_id === ex.id ? saved.previous : null;
  if (prev) {                     // re-extracted: the earlier review stays with the extraction it was made on
    const n = prev.flags.length + (prev.missing || []).length;
    const box = el("div", `Your review of extraction #${prev.extraction_id} (saved ${ist(prev.updated_at)}, ${n} marked${prev.remarks ? ", with remarks" : ""}) is kept with that extraction. This newer extraction has no review yet.`, "notice");
    const copy = el("button", "Copy that review here");
    copy.title = "Copies its marks and remarks onto this extraction; then check them against the new output.";
    copy.onclick = async () => {
      for (const k of prev.flags) if (!k.startsWith("txn.") || Number(k.slice(4)) < current.txnCount) current.flags.add(k);
      for (const k of prev.missing || []) current.missing.add(k);
      if (prev.remarks && !current.remarks.includes(prev.remarks)) current.remarks = (current.remarks ? current.remarks + "\n" : "") + prev.remarks;
      if (await save()) show(doc.id);
    };
    box.append(copy); out.append(box);
  }

  out.append(goldenBox(gold, ex));
  if (current.sr) out.append(selfReviewBox(current.sr, saved.extraction_id === ex.id ? saved.calibration : null));

  out.append(el("h2", "Account & statement"));
  const MONEY = new Set(["opening_balance", "closing_balance", "total_debits", "total_credits"]);
  out.append(fieldTable(HEADER_FIELDS.map(([k, label]) => ["header." + k, label, MONEY.has(k) ? inr(h[k]) : h[k]])));
  if (st.summary) {
    out.append(el("h2", "Totals printed by the bank"));
    out.append(fieldTable(SUMMARY_FIELDS.map(([k, label]) => ["summary." + k, label, MONEY.has(k) ? inr(sm[k]) : sm[k]])));
  }

  const txns = st.transactions || [];
  out.append(el("h2", `Transactions (${txns.length})`));
  out.append(el("div", "Amber edge = row named by a validation issue. Tick a row if any of its values is wrong. Rows the extractor missed: describe them in the remarks.", "muted legend"));
  const t = el("table", null, "txns");
  const hr = el("tr");
  const COLS = { Date: "txn_date", Description: "description", Ref: "reference", Debit: "debit", Credit: "credit", Balance: "balance" };
  for (const c of ["✗", "#", "Date", "Description", "Ref", "Debit", "Credit", "Balance", "Pg"]) {
    const th = el("th", c);
    if (COLS[c]) { const tag = confTag("transactions." + COLS[c]); if (tag) th.append(el("br"), tag); }
    hr.append(th);
  }
  const thead = el("thead"); thead.append(hr); t.append(thead);
  const tb = el("tbody");
  for (const x of txns) {
    const key = "txn." + x.row_index;
    const tr = el("tr", null, "txn" + (issueRows.has(x.row_index) ? " issue" : ""));
    tr.append(checkboxCell(key, tr));
    tr.append(el("td", x.row_index + 1), el("td", x.txn_date, "nowrap"), el("td", x.description, "desc"), el("td", x.reference ?? ""),
              el("td", inr(x.debit), "num"), el("td", inr(x.credit), "num"), el("td", inr(x.balance), "num"), el("td", x.page ?? ""));
    tr.onclick = e => { if (e.target.type !== "checkbox" && x.page) document.getElementById("page-" + x.page)?.scrollIntoView({ behavior: "smooth" }); };
    tb.append(tr);
  }
  t.append(tb); const wrapT = el("div", null, "tablewrap"); wrapT.append(t); out.append(wrapT);

  out.append(el("h2", "Remarks"));
  const ta = el("textarea"); ta.placeholder = "Your observations: what is wrong, patterns you notice, anything to fix."; ta.value = current.remarks;
  ta.oninput = () => { current.remarks = ta.value; scheduleSave(); };
  out.append(ta);

  const bar = el("div", null, "bar");
  const btn = el("button", "Save review", "primary"); btn.id = "save-btn"; btn.onclick = () => save();
  bar.append(btn, el("span", "", "muted")); bar.lastChild.id = "save-state";
  bar.append(el("span", "", "muted")); bar.lastChild.id = "flag-count";
  bar.append(el("span", null, "spacer")); bar.lastChild.style.flex = "1";
  bar.append(approveButton(doc, ex, gold, token));
  out.append(bar);
  updateCounts(review ? "Saved ✓ " + ist(review.updated_at) : "Not saved yet", review ? "ok" : "");
}

async function reextract(docId, oldExtractionId, token) {
  await fetch(`/api/documents/${docId}/reprocess`, { method: "POST" });
  for (let i = 0; i < 90 && token === showToken; i++) {        // wait for the new extraction
    await new Promise(r => setTimeout(r, 1000));
    const b = await (await fetch("/api/documents/" + docId)).json();
    if (b.extraction && b.extraction.id !== oldExtractionId) break;
    if (["FAILED", "NEEDS_PASSWORD", "NEEDS_OCR"].includes(b.document.status)) break;
  }
  if (token === showToken) show(docId);
}

// --- golden statements (Stage 9) ------------------------------------------------------------
const WARNING_TEXT = { no_opening_balance: "no opening balance is printed, so the first row's balance cannot be checked",
                       balance_missing: "a row has no printed balance", missing_header_field: "an account field was not found",
                       no_running_balance: "the statement prints no running balance", date_out_of_order: "dates are not in order",
                       date_outside_period: "a date lies outside the statement period",
                       text_not_captured: "some text inside the table belongs to no row (lost)",
                       empty_description: "a row has no description",
                       description_start_at_end: "a description ends with words that usually start one (a line may have moved)",
                       label_in_value: "an account value contains a label word" };

function goldenBox(gold, ex) {
  const g = gold.golden;
  if (!g) return el("div", "Not golden yet. When every field is OK and saved, approve it as golden: from then on any change to its output is caught.", "muted");
  const changes = gold.differs || [];
  const box = el("div", null, "golden" + (changes.length ? " differs" : ""));
  box.append(el("strong", `Golden v${g.version}`), el("span", ` · approved${g.approved_by === "agent" ? " by the agent (its layout earned autonomy; you can still mark it)" : ""} ${ist(g.approved_at)} · extraction #${g.extraction_id}${g.template_id ? " · " + g.template_id : ""}`, "muted"));
  if (changes.length) {
    box.append(el("div", `This extraction differs from the golden output in ${changes.length} field(s). If the new output is right, check it and approve again (v${g.version + 1}); v${g.version} is kept.`));
    const ul = el("ul");
    for (const c of changes.slice(0, 50)) ul.append(el("li", `${c.path}: ${c.old ?? "—"} → ${c.new ?? "—"}`));
    box.append(ul);
  } else box.append(el("div", "This extraction matches the golden output exactly.", "muted"));
  return box;
}

function approveButton(doc, ex, gold, token) {
  const g = gold.golden, same = g && !(gold.differs || []).length;
  const btn = el("button", same ? "Golden ✓" : g ? `Approve again as golden v${g.version + 1}` : "Approve as golden", "secondary");
  btn.disabled = same;
  btn.title = "Only when every field is OK and the review is saved. The output is then protected by the regression gate.";
  btn.onclick = async () => {
    await flushSave();
    const post = ack => fetch(`/api/documents/${doc.id}/golden`, { method: "POST", headers: { "Content-Type": "application/json" },
                                                                   body: JSON.stringify({ extraction_id: ex.id, acknowledge_warnings: ack }) });
    btn.disabled = true; const label = btn.textContent; btn.textContent = "Checking…";
    try {
      let r = await post(false), body = await r.json().catch(() => null);
      const d = body && body.detail;
      if (r.status === 409 && d && d.code === "warnings") {
        const list = d.warnings.map(w => "• " + (WARNING_TEXT[w] || w)).join("\n");
        if (!confirm(`Validation has ${d.warnings.length} warning(s):\n${list}\n\nApprove anyway? Only if you checked these against the PDF.`)) { btn.textContent = label; btn.disabled = false; return; }
        r = await post(true); body = await r.json().catch(() => null);
      }
      if (!r.ok) throw new Error((body && body.detail && (body.detail.message || body.detail)) || `the server answered ${r.status}`);
      if (token === showToken) show(doc.id);
    } catch (e) {
      btn.textContent = label; btn.disabled = false;
      updateCounts("Not approved: " + e.message, "bad");
    }
  };
  return btn;
}

// --- the system's self-review (Stage 10.4, D-024) -------------------------------------------
const CONF_TEXT = { high: "high", medium: "medium", low: "low", missing: "missing" };
function confTag(key) {
  const f = current.sr && current.sr.fields && current.sr.fields[key];
  if (!f) return null;
  const tag = el("span", CONF_TEXT[f.level] || f.level, "conf " + f.level);
  tag.title = "Agent's confidence: " + f.reason;
  return tag;
}

function selfReviewBox(sr, cal) {
  const box = el("div", null, "selfrev");
  box.append(el("strong", "Agent's self-review"), el("span", "  " + sr.summary, "muted"));
  if (sr.confidence) {               // confidence in the whole statement (Stage 11.2, D-029)
    const c = sr.confidence;
    const pill = el("span", "Confidence: " + c.level, "conf " + c.level);
    pill.title = c.reasons.length ? "Why not high: " + c.reasons.join(", ") : "Nothing lowers it"
      + (c.covered_by_track_record && c.covered_by_track_record.length ? "; left to the layout's track record: " + c.covered_by_track_record.join(", ") : "");
    box.append(" ", pill);
  }
  const R = current.routing;          // who checks it (Stage 11.3, D-029)
  if (R) box.append(el("div", R.required
      ? `Your review is needed (${R.reason.replaceAll("_", " ")}` + (R.layout ? `; layout ${R.layout}: ${R.run} of ${R.threshold} reviews in a row without a correction` : "") + ")."
      : `Your review is not needed: confident, and layout ${R.layout} has earned autonomy (${R.run} of ${R.threshold}).`, "muted"));
  const L = sr.learning;
  if (L && L.template) {
    const how = L.proposer ? `learned by ${L.proposer}` + (L.columns ? `, columns named ${L.columns}` : "") + (L.model ? ` (${L.model})` : "")
                           : `made ${L.made_by}`;
    box.append(el("div", `Template ${L.template}: ${how}.`, "muted"));
  } else if (L) box.append(el("div", "No template yet: " + L.proposer + ".", "muted"));
  if (sr.checked.length) {
    box.append(el("h3", "What I checked"));
    const ul = el("ul"); for (const c of sr.checked) ul.append(el("li", c)); box.append(ul);
  }
  if (sr.unsure.length) {
    box.append(el("h3", "What I'm unsure of — do you agree?"));
    const ul = el("ul");
    for (const u of sr.unsure) {
      const li = el("li", u.text, u.muted ? "muted" : null);   // muted: you called this worry not useful before (D-027)
      const v = el("span", null, "verdict");
      const fb = () => current.feedback[u.id] || null;
      const btns = {};
      for (const [val, label] of [["agree", "Agree"], ["disagree", "Disagree"]]) {
        const b = el("button", label); b.type = "button";
        b.title = val === "agree" ? "Yes, this deserved a look (or it was right to doubt it)" : "No, this worry was wrong or not useful";
        b.onclick = () => {
          const cur = fb();
          if (cur && cur.verdict === val) delete current.feedback[u.id];
          else current.feedback[u.id] = { verdict: val, note: cur ? cur.note : "" };
          paint(); scheduleSave();
        };
        btns[val] = b; v.append(b);
      }
      const note = el("input", null, "note"); note.type = "text"; note.maxLength = 500; note.placeholder = "optional note";
      note.oninput = () => {            // a note belongs to a verdict: it is enabled once one is chosen
        const cur = fb(); if (!cur) return;
        current.feedback[u.id] = { verdict: cur.verdict, note: note.value }; scheduleSave();
      };
      const paint = () => {
        const cur = fb();
        for (const k in btns) btns[k].classList.toggle("on", !!cur && cur.verdict === k);
        note.disabled = !cur; note.placeholder = cur ? "optional note" : "choose Agree or Disagree first";
        if (document.activeElement !== note) note.value = cur ? cur.note : "";
      };
      paint();
      li.append(v, el("br"), note);
      ul.append(li);
    }
    box.append(ul);
  }
  if (cal) {
    const bits = [];
    if (cal.wrong_but_rated_high.length) bits.push(`${cal.wrong_but_rated_high.length} field(s) you marked wrong or missing were rated high: ${cal.wrong_but_rated_high.join(", ")}`);
    if (cal.rows_marked_wrong_not_flagged.length) bits.push(`${cal.rows_marked_wrong_not_flagged.length} row(s) you marked wrong were not among the things I was unsure of`);
    box.append(el("div", bits.length ? "Calibration: " + bits.join("; ") + "." : "Calibration: nothing you marked wrong was rated high.", bits.length ? "" : "muted"));
  }
  // Training examples (Stage 10.7, D-027): what the agent has learned from your reviews.
  const learned = el("div", null, "muted");
  box.append(learned);
  fetch("/api/training-examples/summary").then(r => r.ok ? r.json() : null).then(s => {
    if (s) learned.textContent = `${s.total} example(s) learned from your approvals and reviews.`;
  }).catch(() => {});
  return box;
}

function fieldTable(rows) {
  const t = el("table");
  for (const [key, label, value] of rows) {
    const tr = el("tr");
    const empty = value == null || value === "";
    const conf = el("td"); const tag = confTag(key); if (tag) conf.append(tag);
    tr.append(stateCell(key, tr, empty), el("td", label, "muted"), el("td", empty ? "—" : value), conf);
    t.append(tr);
  }
  return t;
}

// Header and summary fields: OK / Wrong / Missing (printed on the statement but not extracted).
function stateCell(key, tr, empty) {
  const td = el("td", null, "nowrap");
  const sel = el("select", null, "state"); sel.title = "Is this output right?";
  const choices = [["ok", "OK"], ["wrong", "Wrong"], ["missing", empty ? "Missing (it is printed)" : "Incomplete (part missing)"]];
  for (const [v, text] of choices) { const o = el("option", text); o.value = v; sel.append(o); }
  const paint = () => { tr.classList.toggle("flagged", sel.value === "wrong"); tr.classList.toggle("missing", sel.value === "missing"); };
  sel.value = current.missing.has(key) ? "missing" : current.flags.has(key) ? "wrong" : "ok";
  paint();
  sel.onchange = () => {
    current.flags.delete(key); current.missing.delete(key);
    if (sel.value === "wrong") current.flags.add(key);
    if (sel.value === "missing") current.missing.add(key);
    paint(); scheduleSave();
  };
  td.append(sel);
  return td;
}

function checkboxCell(key, tr) {
  const td = el("td", null, "cb");
  const cb = el("input"); cb.type = "checkbox"; cb.checked = current.flags.has(key); cb.title = "Mark as incorrect";
  tr.classList.toggle("flagged", cb.checked);
  cb.onchange = () => {
    if (cb.checked) current.flags.add(key); else current.flags.delete(key);
    tr.classList.toggle("flagged", cb.checked);
    scheduleSave();
  };
  td.append(cb);
  return td;
}

function updateCounts(state, kind = "") {
  const s = $("#save-state");
  if (s && state) { s.textContent = state; s.className = "muted " + kind; }
  const c = $("#flag-count");
  if (c) c.textContent = `· ${current.flags.size} wrong · ${current.missing.size} missing`;
}

let dirty = false;           // edits not yet stored on the server
function scheduleSave() { dirty = true; updateCounts("Unsaved changes…"); clearTimeout(saveTimer); saveTimer = setTimeout(save, 900); }
async function flushSave() { if (dirty && current) await save(); }

// Returns true when the server stored the review. Errors are shown on screen, never swallowed.
async function save() {
  clearTimeout(saveTimer); saveTimer = null;
  const docId = current.docId;
  const payload = { extraction_id: current.extractionId, flags: [...current.flags],
                    missing: [...current.missing], remarks: current.remarks };
  if (current.sr) payload.agent_feedback = current.feedback;
  const body = JSON.stringify(payload);
  const btn = $("#save-btn"); if (btn) btn.disabled = true;
  updateCounts("Saving…");
  try {
    const r = await fetch(`/api/documents/${docId}/review`, { method: "PUT", headers: { "Content-Type": "application/json" }, body });
    let rv = null; try { rv = await r.json(); } catch { /* error page that is not JSON */ }
    if (!r.ok) throw new Error((rv && rv.detail) || `the server answered ${r.status}`);
    if (current.docId === docId) { dirty = false; updateCounts("Saved ✓ " + ist(rv.updated_at), "ok"); }
    loadSources(current.docId);
    return true;
  } catch (e) {
    if (current.docId === docId) updateCounts("Save failed: " + e.message + ". Your marks are still on screen; press Save review again.", "bad");
    return false;
  } finally { if (btn) btn.disabled = false; }
}
window.addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

loadSources();
</script>
</body>
